version: '3.8'

services:
  # ==========================================
  # 1. PRODUCTION ENVIRONMENT (Nhánh test2.0)
  # ==========================================
  production:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vju-calendar-production
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=5055
      - ENVIRONMENT=production
      - SNAPSHOT_PATH=/app/webapp/data/manual_state_snapshot_prod.json
    ports:
      - "5055:5055"
    volumes:
      - prod_data:/app/webapp/data

  # ==========================================
  # 2. SANDBOX / STAGING ENVIRONMENT (Nhánh test)
  # ==========================================
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vju-calendar-sandbox
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=5056
      - ENVIRONMENT=sandbox
      - SNAPSHOT_PATH=/app/webapp/data/manual_state_snapshot_sandbox.json
    ports:
      - "5056:5056"
    volumes:
      - sandbox_data:/app/webapp/data

volumes:
  prod_data:
  sandbox_data:
